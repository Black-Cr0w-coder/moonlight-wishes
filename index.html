<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday, Sis!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

    /* Reset */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #222; /* dark background behind slideshow */
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Slideshow container */
    .background-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: #222; /* fallback background */
    }

    /* Each slide */
    .bgSlide {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background-size: contain; /* show full image */
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .bgSlide.active {
      opacity: 1;
      z-index: 1;
    }

    /* Main content */
    .content {
      position: relative;
      z-index: 10;
      padding: 50px 20px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      transition: opacity 1s ease;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      text-shadow: 0 0 20px #3a9cff, 0 0 30px #508cff, 0 0 40px #6aa3ff;
      margin-bottom: 0.2em;
    }

    .message {
      font-size: 1.5em;
      font-weight: 600;
      line-height: 1.4;
      color: #ccc;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
      min-height: 160px;
      white-space: pre-line;
    }

    .quote {
      font-style: italic;
      margin-top: 15px;
      color: #7ab8ff;
      text-shadow: 0 0 5px rgba(0,0,0,0.6);
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
      .message {
        font-size: 1rem;
      }
    }

  </style>
</head>
<body>

  <!-- Slideshow -->
  <div class="background-slideshow" aria-label="Background slideshow">
    <div class="bgSlide active" style="background-image: url('Image 2.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 3.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 4.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 5.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 6.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 7.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 8.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 9.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 11.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 12.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 13.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 14.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 15.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 16.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 17.jpg');"></div>
    <div class="bgSlide" style="background-image: url('Image 18.jpg');"></div>
  </div>

  <!-- Content -->
  <div class="content" role="main">
    <h1>🎉 Happy Birthday, Sis! 🎉</h1>
    <div class="message" id="message"></div>
    <div class="quote" id="quote">"Wolves <em>don’t chase</em> validation — they just keep running."</div>
  </div>

  <script>
    const messages = [
      "Hey sis — happy birthday! You’ve always had that mix of strength and heart that people don’t forget.",
      "No matter what comes your way, you handle it like the boss you are.",
      "Keep moving forward — the world’s better with you in it."
    ];

    const messageEl = document.getElementById('message');
    let i = 0;

    function displayMessage() {
      if (i < messages.length) {
        const current = messages[i];
        let idx = 0;
        const interval = setInterval(() => {
          messageEl.innerHTML += current[idx];
          idx++;
          if (idx === current.length) {
            clearInterval(interval);
            i++;
            messageEl.innerHTML += "\n\n";
            setTimeout(displayMessage, 1000);
          }
        }, 50);
      }
    }

    displayMessage();

    // Slideshow functionality
    const slides = document.querySelectorAll('.bgSlide');
    let slideIndex = 0;

    function showSlides() {
      slides.forEach(slide => slide.classList.remove('active'));
      slides[slideIndex].classList.add('active');
      slideIndex = (slideIndex + 1) % slides.length;
      setTimeout(showSlides, 4000);
    }

    showSlides();
  </script>

</body>
</html>
